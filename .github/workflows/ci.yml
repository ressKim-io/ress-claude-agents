name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 최소 권한 (OWASP CICD-SEC-3). 모든 job 이 체크아웃 + 로컬 스크립트 실행만 하고
# GITHUB_TOKEN 으로 쓰기를 하지 않는다. 선언이 없으면 레포 기본 권한이 암묵 부여된다.
permissions:
  contents: read

jobs:
  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate documentation consistency
        run: ./scripts/generate-docs.sh validate

  inventory:
    name: Inventory Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate inventory freshness
        run: ./scripts/generate-inventory.sh validate

  lint:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh

  drift:
    name: Rules / Frontmatter / Adapter Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate AGENTS.md ↔ rules drift
        run: ./scripts/validate-rules-drift.sh all

      - name: Validate commands/ ↔ .claude/commands/ drift
        run: ./scripts/validate-commands-drift.sh all

      - name: Validate skill/agent frontmatter
        run: ./scripts/validate-skill-frontmatter.sh all

      - name: Validate inventory labels freshness
        run: ./scripts/generate-inventory-labels.sh validate

      - name: Validate agent handoff
        run: ./scripts/validate-agent-handoff.sh all

      # 2026-08-24 Step 5: CI 에 없어서 `.agents/` dangling ref 실패가 방치돼 있었다.
      # 근거: docs/audit/2026-08-24-agent-harness-readiness.md §6 Step 5
      - name: Validate manifest schemas
        run: ./scripts/validate-schemas.sh

      # 2026-08-25 Step 6: 강제 규칙(.claude/settings.json)과 user-approval.md 의
      # 드리프트 게이트. 런타임 발동 여부는 claude CLI 가 필요해 여기서 못 본다 —
      # `make verify-enforcement` 로 로컬에서 확인한다 (ADR 0009 §Consequences).
      - name: Validate enforcement rules
        run: ./scripts/validate-enforcement.sh

      # 2026-08-26 PR #36 리뷰: Step 2 의 skill 이관이 상호 참조를 고치지 않아
      # 79개 링크가 깨진 채 남아 있었다 (4개는 매 세션 로드되는 AGENTS.md 안).
      # 링크를 보는 job 이 하나도 없었다.
      - name: Validate internal markdown links
        run: ./scripts/validate-links.sh

      - name: Setup Node (for control-plane adapter)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: control-plane/package-lock.json

      - name: Install control-plane dependencies
        working-directory: control-plane
        run: npm ci

      - name: Build control-plane
        working-directory: control-plane
        run: npm run build

      # 2026-08-25 Step 6: control-plane vitest 가 CI 에서 돈 적이 없다.
      # F11(죽은 hook 이 3.5개월간 방치)의 2차 원인 — 로컬에서만 도는 테스트는
      # 회귀를 막지 못한다.
      - name: Test control-plane
        working-directory: control-plane
        run: npm test

      - name: Adapter parity drift (P4 — cursor only; codex 지원 중단 2026-08-25, ADR 0010)
        run: |
          for tool in cursor; do
            echo "=== adapter --tool=$tool ==="
            node control-plane/dist/cli.js adapter \
              --tool="$tool" \
              --root="$PWD" \
              --assets="$PWD/assets"
          done
          if ! git diff --quiet -- .cursor/; then
            echo "::error::adapter parity drift detected. Run locally:"
            echo "  cd control-plane && npm run build && cd .."
            echo "  node control-plane/dist/cli.js adapter --tool=cursor --root=. --assets=./assets"
            echo "Then commit the regenerated view files."
            git diff --stat -- .cursor/
            exit 1
          fi
