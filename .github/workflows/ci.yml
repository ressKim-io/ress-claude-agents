name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 최소 권한 (OWASP CICD-SEC-3). 모든 job 이 체크아웃 + 로컬 스크립트 실행만 하고
# GITHUB_TOKEN 으로 쓰기를 하지 않는다. 선언이 없으면 레포 기본 권한이 암묵 부여된다.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run BATS tests
        run: bats tests/install.bats

  # macOS 는 /bin/bash 가 3.2 라 `set -u` + 빈 배열 `${arr[@]}` 확장이 unbound
  # 오류를 낸다 (bash 4.4+ 에서 수정된 동작). ubuntu 러너(bash 5.x)만 돌리면
  # 이 계열 회귀를 못 잡는다 — 실제로 2026-08-16 audit 에서 install.sh 가
  # macOS 에서 어떤 플래그 조합으로도 완주하지 못하는 상태가 발견됐다.
  # paths 필터를 걸지 않는 이유: 이 job 은 main branch protection 의 required status
  # check 에 등록돼 있다. 경로 필터로 skip 되면 체크 컨텍스트가 보고되지 않아 해당
  # PR 이 "Waiting for status to be reported" 로 영구 대기한다. macOS 러너 과금
  # (PR #32 리뷰 CR-011) 보다 머지 차단 위험이 크다고 판단해 항상 실행한다.
  # 비용이 문제가 되면 required check 에서 먼저 빼고 필터를 걸어야 한다.
  install-macos:
    name: install.sh smoke (macOS bash 3.2)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show bash version
        run: /bin/bash --version | head -1

      - name: Run install.sh across flag combinations
        run: |
          set -eu
          REPO="$PWD"
          fail=0
          run_case() {
            desc="$1"; shift
            tmp="$(mktemp -d)"
            cd "$tmp"
            if out="$(/bin/bash "$REPO/install.sh" "$@" 2>&1)"; then
              if printf '%s' "$out" | grep -qiE 'unbound variable|Error occurred at line'; then
                echo "FAIL  $desc — 오류 출력 감지"
                printf '%s\n' "$out" | grep -iE 'unbound variable|Error occurred at line' | head -3
                fail=1
              else
                echo "ok    $desc"
              fi
            else
              echo "FAIL  $desc — exit $?"
              printf '%s\n' "$out" | tail -5
              fail=1
            fi
            cd "$REPO"; rm -rf "$tmp"
          }
          run_case "--local --all"              --local --all
          run_case "--local --all --with-skills" --local --all --with-skills
          run_case "--local --modules go"       --local --modules go
          run_case "--local --modules memory,review,workflow" --local --modules memory,review,workflow
          run_case "--local --plugin backend-go" --local --plugin backend-go
          run_case "--local --workflow msa-migration" --local --workflow msa-migration
          run_case "--list-plugins"             --list-plugins
          run_case "--list-workflows"           --list-workflows
          exit "$fail"

      # 2026-08-24 Step 5 회귀 방지: `--plugin X --with-skills` 가 전체 skill 을 설치하던 결함.
      # WITH_SKILLS 전체 설치 블록이 plugin 산출물을 backup_and_link ... "dir" 로 덮어썼다.
      # 근거: docs/audit/2026-08-24-agent-harness-readiness.md §6 Step 5 / ADR 0007
      - name: Verify --plugin narrows skill scope
        run: |
          set -eu
          REPO="$PWD"
          expected=0
          for c in go msa architecture; do
            n=$(grep -l "^category: $c$" .claude/skills/*/SKILL.md | wc -l)
            expected=$((expected + n))
          done
          total=$(find .claude/skills -name SKILL.md | wc -l)

          tmp="$(mktemp -d)"; cd "$tmp"
          /bin/bash "$REPO/install.sh" --local --plugin backend-go --with-skills >/dev/null 2>&1
          got=$(find .claude/skills -name SKILL.md 2>/dev/null | wc -l)
          cd "$REPO"; rm -rf "$tmp"

          echo "plugin backend-go --with-skills: got=$got expected=$expected (total=$total)"
          if [ "$got" -ne "$expected" ]; then
            echo "FAIL  plugin 범위 축소가 동작하지 않는다"
            exit 1
          fi
          if [ "$got" -eq "$total" ]; then
            echo "FAIL  전체 skill 이 설치됐다 — 범위 축소 무효화 회귀"
            exit 1
          fi
          echo "ok    plugin 범위 축소 동작"

      - name: Verify flattened commands resolve by bare name
        run: |
          set -eu
          REPO="$PWD"
          tmp="$(mktemp -d)"
          cd "$tmp"
          /bin/bash "$REPO/install.sh" --local --modules memory,review,workflow >/dev/null 2>&1
          missing=0
          for n in where related log-trouble log-decision log-meta log-summary log-feedback \
                   consolidate-devlogs consolidate-memory promote-devlog archive-devlog \
                   review-pr review-pr-k8s review-pr-monitoring review-pr-terraform phase-start; do
            [ -e "$tmp/.claude/commands/$n.md" ] || { echo "MISSING /$n"; missing=1; }
          done
          cd "$REPO"; rm -rf "$tmp"
          exit "$missing"

  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate documentation consistency
        run: ./scripts/generate-docs.sh validate

  inventory:
    name: Inventory Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate inventory freshness
        run: ./scripts/generate-inventory.sh validate

  lint:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on install.sh
        run: shellcheck install.sh

      - name: Run shellcheck on scripts
        run: shellcheck scripts/*.sh

  drift:
    name: Rules / Frontmatter / Adapter Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate AGENTS.md ↔ rules drift
        run: ./scripts/validate-rules-drift.sh all

      - name: Validate commands/ ↔ .claude/commands/ drift
        run: ./scripts/validate-commands-drift.sh all

      - name: Validate skill/agent frontmatter
        run: ./scripts/validate-skill-frontmatter.sh all

      - name: Validate inventory labels freshness
        run: ./scripts/generate-inventory-labels.sh validate

      - name: Validate agent handoff + workflow/plugin skill refs
        run: ./scripts/validate-agent-handoff.sh all

      # 2026-08-24 Step 5: CI 에 없어서 `.agents/` dangling ref 실패가 방치돼 있었다.
      # 근거: docs/audit/2026-08-24-agent-harness-readiness.md §6 Step 5
      - name: Validate manifest schemas
        run: ./scripts/validate-schemas.sh

      # 2026-08-25 Step 6: 강제 규칙(.claude/settings.json)과 user-approval.md 의
      # 드리프트 게이트. 런타임 발동 여부는 claude CLI 가 필요해 여기서 못 본다 —
      # `make verify-enforcement` 로 로컬에서 확인한다 (ADR 0009 §Consequences).
      - name: Validate enforcement rules
        run: ./scripts/validate-enforcement.sh

      - name: Setup Node (for control-plane adapter)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: control-plane/package-lock.json

      - name: Install control-plane dependencies
        working-directory: control-plane
        run: npm ci

      - name: Build control-plane
        working-directory: control-plane
        run: npm run build

      # 2026-08-25 Step 6: control-plane vitest 가 CI 에서 돈 적이 없다.
      # F11(죽은 hook 이 3.5개월간 방치)의 2차 원인 — 로컬에서만 도는 테스트는
      # 회귀를 막지 못한다.
      - name: Test control-plane
        working-directory: control-plane
        run: npm test

      - name: Adapter parity drift (P4 — codex + cursor only; .claude/skills SKILL.md is gitignored until P7)
        run: |
          for tool in codex cursor; do
            echo "=== adapter --tool=$tool ==="
            node control-plane/dist/cli.js adapter \
              --tool="$tool" \
              --root="$PWD" \
              --assets="$PWD/assets"
          done
          if ! git diff --quiet -- .codex/skills/ .codex/agents/ .cursor/; then
            echo "::error::adapter parity drift detected. Run locally:"
            echo "  cd control-plane && npm run build && cd .."
            echo "  for t in codex cursor; do node control-plane/dist/cli.js adapter --tool=\$t --root=. --assets=./assets; done"
            echo "Then commit the regenerated view files."
            git diff --stat -- .codex/skills/ .codex/agents/ .cursor/
            exit 1
          fi
