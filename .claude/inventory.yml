      lines: 498
      title: "Compliance Frameworks Guide"
      desc: "SOC2, HIPAA, GDPR, PCI-DSS 컴플라이언스 프레임워크 비교와 통제 항목 매핑, K8s 적용, 자동 증거 수집. Use when 인증 감사를 준비하거나 어떤 프레임워크가 필요한지 판단하고 audit finding 을 해소할 때."
    - name: data-subject-rights
      lines: 536
      title: "Data Subject Rights — DSR 자동화 운영"
      desc: "정보주체 권리 행사 DSR 자동화 — PIPA·GDPR·CCPA 열람·정정·삭제·이동, 본인 인증, 삭제 vs 익명화, Crypto-Shredding, 수탁자 통지. Use when 이용자 삭제·열람 요청 처리 파이프라인을 구현할 때."
    - name: kr-location-info-act
      lines: 449
      title: "Korean Location Information Act — 위치정보법 운영"
      desc: "위치정보법 운영 — 사업 신고·허가, 별도 동의(제18조), 보유·파기, 국외 이전, 위반 처벌, PIPA·GDPR 비교. Use when 차량·사람·디바이스 GPS 를 다루는 국내 서비스의 법 적용 여부와 동의 흐름을 설계할 때."
    - name: ops-mcp-security
      lines: 344
      title: "운영 MCP 서버 보안"
      desc: "운영 시스템에 붙는 MCP 서버를 자격 증명 경계, 서버 read-only 모드, Claude Code deny 규칙의 세 겹으로 묶고 운영 데이터를 신뢰하지 않는 입력으로 다룬다. Use when 에이전트에 Kubernetes·관측·CI 같은 운영용 MCP 서버를 연결하거나 그 권한과 보안 권고를 점검할 때."
    - name: owasp-top10
      lines: 505
      title: "OWASP Top 10 방어 가이드"
      desc: "OWASP Top 10(2021) A01~A10 취약점 설명과 언어별 방어 패턴 — Broken Access Control, Injection, SSRF, 암호화 실패 등. Use when 웹·API 코드를 보안 관점으로 리뷰하거나 취약점 유형별 대응법을 찾을 때."
    - name: secrets-management
      lines: 504
      title: "시크릿 관리 가이드"
      desc: "시크릿 관리 — External Secrets Operator, HashiCorp Vault, Infisical, SOPS+age, 로테이션 자동화, Go·Spring 연동. Use when K8s 시크릿 주입 방식을 정하거나 .env 없이 로컬 개발 환경을 구성할 때."
    - name: secure-coding
      lines: 494
      title: "Secure Coding Practices 가이드"
      desc: "시큐어 코딩 — 입력 검증, 출력 인코딩, 암호화, 안전한 에러 처리, 파일 업로드, HTTP 보안 헤더, secure random, CI 보안 테스트. Use when 코드 작성·리뷰 중 언어별 보안 체크리스트가 필요할 때."
    - name: threat-modeling
      lines: 502
      title: "Threat Modeling Guide"
      desc: "위협 모델링 — STRIDE, DREAD 점수화, Microsoft Kubernetes Threat Matrix, 4단계 분석 프로세스, 위협별 완화책. Use when 새 시스템이나 마이크로서비스의 공격 표면을 분석하고 위협 모델 문서를 만들 때."
  service-mesh:
    - name: istio-advanced-traffic
      lines: 535
      title: "Istio 고급 트래픽 관리"
      desc: "Istio 고급 트래픽 — Fault Injection, Traffic Mirroring, Retry/Timeout 심화, JWT claim 라우팅, Canary·Blue-Green. Use when VirtualService 로 카오스 테스트, 섀도 트래픽, 점진 배포를 구성할 때."
    - name: istio-ambient
      lines: 406
      title: "Istio Ambient Mode 심화 가이드"
      desc: "Istio Ambient 모드 심화 — ztunnel, HBONE, Waypoint 설정, targetRefs 정책, Cilium 통합, 마이그레이션. Use when Ambient 를 실제로 활성화하고 waypoint 정책을 붙이거나 sidecar 에서 옮길 때."
    - name: istio-core
      lines: 432
      title: "Istio Core Patterns"
      desc: "Istio 핵심 개념 — Sidecar vs Ambient 비교표, Ambient 제한사항, 하이브리드 구성, mTLS 강제. Use when 서비스 메시 모드를 선택하거나 Istio 기본 구성을 처음 잡을 때."
    - name: istio-ext-authz
      lines: 422
      title: "Istio External Authorization (ext-authz)"
      desc: "Istio 외부 인증 — ExtensionProvider, CUSTOM AuthorizationPolicy, OPA·OAuth2 Proxy 연동, 다계층 정책 조합. Use when 메시 앞단에서 외부 인가 서버로 요청을 검사하게 만들 때."
    - name: istio-gateway
      lines: 119
      title: "Istio Gateway Patterns"
      desc: "Gateway API 와 Istio Gateway 비교 허브 — 기능 매핑, 선택 기준, 마이그레이션. Use when 두 방식 중 무엇을 쓸지 정하거나 세부 skill 로 안내받아야 할 때."
    - name: istio-gateway-api
      lines: 253
      title: "Gateway API (K8s Native)"
      desc: "Istio 에서 Kubernetes Gateway API 와 HTTPRoute 로 트래픽 라우팅 — ReferenceGrant 로 cross-namespace 허용. Use when Istio 를 Gateway API 방식으로 구성하고 HTTPRoute 를 작성할 때."
    - name: istio-gateway-classic
      lines: 264
      title: "Istio Gateway (Classic)"
      desc: "Istio 고유 Gateway + VirtualService 기반 라우팅과 TLS 설정. Use when 기존 Istio Gateway/VirtualService 리소스를 작성하거나 유지보수할 때."
    - name: istio-gitops
      lines: 458
      title: "Istio GitOps 통합 가이드"
      desc: "ArgoCD 로 Istio 설치·업그레이드 — CRD sync wave, cert-manager 통합, kind 주의점, ignoreDifferences. Use when Istio 를 GitOps 로 배포하다 sync 순서나 OutOfSync 문제를 겪을 때."
    - name: istio-metrics
      lines: 187
      title: "Istio Metrics & Prometheus Integration"
      desc: "Istio 메트릭 수집 — Prometheus ServiceMonitor, RED 쿼리, Telemetry API 로 메트릭 커스터마이징, Grafana 대시보드. Use when 메시 트래픽의 요청률·에러·지연을 Prometheus 로 뽑을 때."
    - name: istio-multicluster
      lines: 491
      title: "Istio 멀티클러스터 가이드"
      desc: "Istio 멀티클러스터 — Multi-Primary, Primary-Remote, East-West Gateway, Shared Root CA, cross-cluster discovery. Use when 클러스터 여러 개를 하나의 메시로 묶거나 cross-cluster 호출이 실패할 때."
    - name: istio-observability
      lines: 111
      title: "Istio Observability Patterns"
      desc: "Istio 모니터링 허브 — 모드별(sidecar/ambient) 메트릭 수집 구조, 메트릭·트레이싱·Kiali 구성요소 안내. Use when Istio 관측 구성을 개괄하고 세부 skill 을 고를 때."
    - name: istio-otel
      lines: 507
      title: "Istio + OpenTelemetry 통합 가이드"
      desc: "Istio 와 OpenTelemetry 통합 — Telemetry API v1, ExtensionProvider, W3C Trace Context 전파, access log 를 OTel Collector 로. Use when 메시 텔레메트리를 OTel Collector 로 보내도록 설정할 때."
    - name: istio-pitfalls
      lines: 185
      title: "Istio 실전 Pitfalls"
      desc: "Istio 실전 함정 — VirtualService FQDN, AuthorizationPolicy 경로 매칭, PeerAuthentication selector, JWKS, native sidecar, forwardOriginalToken. Use when Istio 에서 장애나 보안 우회가 났거나 PR 전에 함정을 점검할 때."
    - name: istio-security
      lines: 570
      title: "Istio Security 가이드"
      desc: "Istio 보안 — mTLS, PeerAuthentication, AuthorizationPolicy, RequestAuthentication(JWT), Zero Trust. Use when 메시 내부 암호화와 서비스 간 인증·인가 정책을 작성하거나 디버깅할 때."
    - name: istio-tracing
      lines: 208
      title: "Istio Distributed Tracing"
      desc: "Istio 분산 트레이싱 — Jaeger·Tempo 연동, span 생성, Ambient 트레이싱, access logging. Use when 메시 요청을 Jaeger/Tempo 로 추적하도록 구성할 때."
    - name: k8s-traffic-istio
      lines: 233
      title: "Istio Rate Limiting & Circuit Breaker"
      desc: "Istio 기반 Global·Local Rate Limiting 과 Circuit Breaker 패턴. Use when 메시 안에서 EnvoyFilter 나 DestinationRule 로 요청 제한과 장애 격리를 설정할 때."
    - name: linkerd
      lines: 516
      title: "Linkerd Service Mesh 가이드"
      desc: "Linkerd 서비스 메시 — Rust micro-proxy, 자동 mTLS, ServiceProfile, TrafficSplit 카나리, 멀티클러스터, Istio Ambient 와 비교. Use when 경량 메시로 Linkerd 를 도입하거나 설정할 때."
  sre:
    - name: chaos-engineering
      lines: 378
      title: "Chaos Engineering 가이드"
      desc: "LitmusChaos 카오스 엔지니어링 — 원칙, 설치, 기본 실험, Probe 검증, 안티패턴. Use when Kubernetes 에서 장애 주입 실험으로 복원력을 검증하려 할 때. 팀 훈련 운영은 chaos-engineering-gameday."
    - name: chaos-engineering-gameday
      lines: 223
      title: "Chaos Engineering GameDay 가이드"
      desc: "Chaos GameDay 운영 — Pre·During·Post 단계, 진행 중 모니터링·알림, 안티패턴, 체크리스트. Use when 팀이 모여 장애 주입 훈련을 계획하고 진행·회고할 때. 실험 정의와 LitmusChaos 는 chaos-engineering."
    - name: disaster-recovery
      lines: 361
      title: "Disaster Recovery 가이드"
      desc: "재해 복구 기본 — RTO/RPO 정의, DR 전략 비교, Velero 백업 설치·설정, 복구 절차. Use when 목표 복구 시간을 정하고 Kubernetes 백업·복구 체계를 처음 구축할 때. 멀티 클러스터·DB 는 disaster-recovery-advanced."
    - name: disaster-recovery-advanced
      lines: 218
      title: "Disaster Recovery 고급 가이드"
      desc: "DR 심화 — 멀티 클러스터 DR, 데이터베이스 DR, 정기 DR 테스트(월간), 안티패턴. Use when 클러스터를 넘는 재해 복구나 DB 복제·failover 를 설계하고 훈련할 때. RTO/RPO·Velero 기본은 disaster-recovery."
    - name: finops
      lines: 525
      title: "FinOps 가이드"
      desc: "클라우드 비용 최적화 기본 — FinOps 프레임워크, 비용 가시성, right-sizing, Spot Instance, 예약 인스턴스·Savings Plan, 미사용 리소스 정리. Use when 클라우드 청구서를 줄일 방법을 찾는 첫 단계일 때. 세부는 finops-* skill."
    - name: finops-advanced
      lines: 286
      title: "FinOps Advanced 가이드"
      desc: "FinOps 거버넌스 — 성숙도 모델, 태그 기반 비용 할당, 비용 이상 탐지, 안티패턴. Use when 조직 단위로 비용 태그 체계와 이상 탐지를 세우고 성숙도를 끌어올릴 때. 기본 절감 기법은 finops."
    - name: finops-ai
      lines: 293
      title: "FinOps for AI — AI 워크로드 비용 관리"
      desc: "AI 워크로드 비용 관리 — LLM 비용 구조, token economics·귀속, GPU 최적화, Shift-Left FinOps, model routing. Use when LLM API·GPU 비용이 늘어 토큰 단위로 추적하고 모델 라우팅으로 줄일 때."
    - name: finops-automation
      lines: 361
      title: "FinOps: 자동화 가이드"
      desc: "FinOps 자동화 — Infracost PR 비용 리뷰, 유휴 리소스 자동 정리, 비정상 리소스 알림. Use when PR 에서 인프라 변경 비용을 미리 보거나 쓰지 않는 리소스를 자동으로 치울 때."
    - name: finops-greenops
      lines: 571
      title: "GreenOps 가이드"
      desc: "GreenOps — 클라우드 탄소 발자국 측정, 저탄소 리전 선택, ARM 인스턴스 전환, 오프피크 스케줄링, SCI(Software Carbon Intensity). Use when 비용 절감과 함께 탄소 배출을 측정·줄이려 할 때."
    - name: finops-showback
      lines: 309
      title: "FinOps: Showback & Chargeback 가이드"
      desc: "팀별 비용 가시화 — Showback·Chargeback 구현, Kubecost 대시보드, AWS CUR 기반 배분, Prophet 비용 예측. Use when 팀·서비스별 클라우드 비용을 보여 주거나 부서에 청구하는 체계를 만들 때."
    - name: finops-tools
      lines: 498
      title: "FinOps Tools 가이드"
      desc: "FinOps 도구 비교와 설치 — OpenCost, Kubecost, Infracost 설정, KEDA+Karpenter 통합. Use when Kubernetes 비용 도구를 고르고 설치하거나 오토스케일링과 묶을 때. 고급 자동화는 finops-tools-advanced."
    - name: finops-tools-advanced
      lines: 346
      title: "FinOps Tools 고급 최적화 가이드"
      desc: "FinOps 도구 심화 — Cast AI 자동 최적화, Kubecost 고급 설정, 4Rs Framework, right-sizing 자동화, Infracost OPA 정책. Use when Kubernetes 비용 최적화를 자동화하거나 비용 정책을 코드로 강제할 때. 도구 선택은 finops-tools."
    - name: incident-postmortem
      lines: 471
      title: "Incident Postmortem — Blameless 회고 + Action Item 추적"
      desc: "Blameless 인시던트 회고 — Severity 매트릭스, 회고 템플릿(Summary·Impact·Timeline KST), 재발 방지 Action Item 추적. Use when 장애 종료 후 포스트모템 문서를 쓰고 후속 조치를 관리할 때. 대응 중 진단은 observability-incident-playbook."
    - name: load-testing
      lines: 410
      title: "부하 테스트 가이드"
      desc: "K6 부하 테스트 — 테스트 유형, 기본·고급 시나리오, Kubernetes 실행, Grafana Cloud K6 분산 테스트, 안티패턴. Use when K6 스크립트로 스파이크·soak 등 부하를 만들고 실행할 때. 결과 분석은 load-testing-analysis."
    - name: load-testing-analysis
      lines: 316
      title: "부하 테스트 분석 가이드"
      desc: "부하 테스트 결과 분석 — nGrinder 사용, 결과 요약·병목 지점·권장 사항 정리, SLO 기반 threshold. Use when 부하 테스트 결과를 해석해 병목을 찾고 보고서를 쓰거나 합격 기준을 정할 때. K6 스크립트는 load-testing."
    - name: load-testing-gatling
      lines: 295
      title: "Gatling 부하 테스트"
      desc: "Gatling 부하 테스트 — Scala/Java DSL, injection 프로파일, Assertions, 분산 실행, HTML 리포트 분석. Use when JVM 기반 부하 테스트 도구로 Gatling 을 선택했거나 Scala/Java DSL 시나리오를 작성할 때."
    - name: runbook-driven-ops
      lines: 392
      title: "Runbook-Driven Ops — 운영 표준화 hub"
      desc: "Runbook 표준 — 분류 매트릭스, 작성 템플릿(Trigger·Prerequisites·Steps·Verification), 알림-runbook 연결, 실행 audit 누적. Use when 운영 절차와 장애 대응을 재현 가능한 runbook 으로 만들고 알림에 연결할 때."
    - name: sre-sli-slo
      lines: 467
      title: "SRE: SLI/SLO/SLA 정의 가이드"
      desc: "SRE 신뢰성 목표 — SLI 유형별 정의, SLO 설정, SLA 구분, error budget 정책, burn rate 알림, Grafana 대시보드. Use when 서비스의 가용성·지연 목표를 숫자로 정하고 error budget 으로 운영할 때."

agents:
  ai:
    - name: mlops-expert
      lines: 175
      title: "MLOps Expert Agent"
      desc: "MLOps 전문가 에이전트. Kubernetes 기반 ML 파이프라인, GPU 스케줄링, 모델 서빙, LLM 배포에 특화. Use for AI/ML workloads on Kubernetes, model training, and inference optimization."
  architecture:
    - name: architect-agent
      lines: 318
      title: "MSA Architect Agent"
      desc: "MSA 아키텍처 설계 에이전트. 서비스 경계 정의, API 계약(protobuf/OpenAPI) 설계, Bounded Context 매핑, 의존성 분석에 특화. Use for microservice architecture design, service decomposition, and API contract definition. compliance-strategy-agent의 compliance-blueprint를 consume하여 data-model에 규제 제약(PIPA/GDPR) 반영. business-decision-agent의 4 ADR(tenancy/auth/payment/notification)을 consume하여 api-contract 설계."
  cicd:
    - name: ci-optimizer
      lines: 480
      title: "CI Optimizer Agent"
      desc: "CI/CD 파이프라인 분석 및 최적화 에이전트. 빌드 시간 분석, 병목 지점 식별, DORA 메트릭 추적, Flaky 테스트 탐지. Use when CI is slow, builds are failing, or you need pipeline optimization."
    - name: cicd-reviewer
      lines: 486
      title: "CI/CD Pipeline Reviewer"
      desc: "CI/CD 파이프라인 종합 리뷰어 — 비용, 캐싱, 권한 범위, 작업 구조, 시크릿 관리 best practice. Use PROACTIVELY when GitHub Actions / GitLab CI workflow files change. 공격자 관점 보안 검증(OWASP CICD Top 10, SLSA, pipeline poisoning)은 cicd-security-reviewer를 함께 호출."
    - name: cicd-security-reviewer
      lines: 454
      title: "CI/CD Security Reviewer (Attack Surface Focus)"
      desc: "CI/CD 공격 표면 전문 리뷰어 — OWASP Top 10 CI/CD Risks + SLSA framework. Pipeline poisoning, secret exfiltration, supply chain compromise를 공격자 관점에서 검증. Use when 보안 audit 또는 공격 시나리오 검증이 필요할 때. 비용/캐싱/best practice 같은 일반 검증은 cicd-reviewer 사용."
    - name: gitops-reviewer
      lines: 497
      title: "GitOps Configuration Reviewer"
      desc: "AI-powered GitOps configuration reviewer. Use PROACTIVELY after ArgoCD Application, Flux Kustomization, or Helm values changes to catch sync, drift, security, and environment isolation issues. Provides Category Budget scoring."
  dx:
    - name: code-reviewer
      lines: 452
      title: "Code Reviewer Agent"
      desc: "Cross-language 시니어 코드 리뷰어 — correctness, readability, 명명, 중복, 테스트 커버리지, 일반 best practice. Use PROACTIVELY after any code change as the default reviewer. 언어 특화 깊은 검증(Go concurrency, Java JVM/Virtual Threads, Python asyncio, React Server Components)은 go-/java-/python-/frontend-expert를 함께 호출."
    - name: dev-logger
      lines: 218
      title: "Dev Logger Agent"
      desc: "개발 과정 기록 에이전트. AI 수정 요청(feedback), 아키텍처 결정(decision), 시스템 개선(meta), 트러블슈팅(troubleshoot) 기록을 구조화된 마크다운으로 저장. Use when /log-* commands are invoked."
    - name: git-workflow
      lines: 496
      title: "Git Workflow Agent"
      desc: "Git 워크플로우 자동화 에이전트. 커밋 메시지 생성, PR 자동화, Changelog 생성, 브랜치 전략 가이드. Use PROACTIVELY when committing, creating PRs, or preparing releases."
    - name: product-engineer
      lines: 302
      title: "Product Engineer Agent"
      desc: "요구사항 분석, 유저스토리 작성, 우선순위 결정, MVP 스코핑 에이전트. 비즈니스 목표와 기술 구현 사이의 번역자. Use for requirements engineering, prioritization, and product strategy."
    - name: security-scanner
      lines: 209
      title: "Security Scanner Agent"
      desc: "AI-powered security vulnerability scanner. Use PROACTIVELY after code changes to detect security issues, misconfigurations, and compliance violations before they reach production."
    - name: tech-lead
      lines: 621
      title: "Tech Lead Agent"
      desc: "기술 전략 수립, RFC/ADR 주도, 팀 오케스트레이션 에이전트. Claude Code Team의 리더 역할. Use for strategic technical decisions, RFC/ADR workflow, and team orchestration. 새 프로젝트의 tenancy/auth/payment/notification 4 ADR orchestration은 business-decision-agent로 위임. 본 agent는 전사 governance / Tech Radar / Build vs Buy 결정에 집중."
  frontend:
    - name: frontend-expert
      lines: 364
      title: "Frontend Expert Agent"
      desc: "Frontend 전문가 — React 19, Next.js 15/16 App Router, React Server Components, React Compiler, Core Web Vitals, 접근성, Vitest/Playwright. Use when frontend-specific Server/Client component 경계 / 성능 / 접근성 검증이 필요할 때. 일반 코드 품질(가독성, 테스트, 명명, 중복)은 code-reviewer 사용. 두 agent 함께 호출 시 frontend 특화 영역은 frontend-expert 결과 우선."
  infra:
    - name: container-security-reviewer
      lines: 440
      title: "Container Security Reviewer (Attack Surface Focus)"
      desc: "컨테이너 공격 표면 전문 리뷰어 — CIS Docker Benchmark + 공급망 공격 방지. Container escape, signed image, runtime security를 공격자 관점에서 검증. Use when 컨테이너 hardening / 공급망 audit이 필요할 때. 일반 빌드 품질(layer optim, size, base image)은 dockerfile-reviewer 사용."
    - name: dockerfile-reviewer
