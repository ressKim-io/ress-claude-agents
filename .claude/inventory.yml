      desc: "MSA 아키텍처 설계 에이전트. 서비스 경계 정의, API 계약(protobuf/OpenAPI) 설계, Bounded Context 매핑, 의존성 분석에 특화. Use for microservice architecture design, service decomposition, and API contract definition. compliance-strategy-agent의 compliance-blueprint를 consume하여 data-model에 규제 제약(PIPA/GDPR) 반영. business-decision-agent의 4 ADR(tenancy/auth/payment/notification)을 consume하여 api-contract 설계."
  cicd:
    - name: ci-optimizer
      lines: 480
      title: "CI Optimizer Agent"
      desc: "CI/CD 파이프라인 분석 및 최적화 에이전트. 빌드 시간 분석, 병목 지점 식별, DORA 메트릭 추적, Flaky 테스트 탐지. Use when CI is slow, builds are failing, or you need pipeline optimization."
    - name: cicd-reviewer
      lines: 486
      title: "CI/CD Pipeline Reviewer"
      desc: "CI/CD 파이프라인 종합 리뷰어 — 비용, 캐싱, 권한 범위, 작업 구조, 시크릿 관리 best practice. Use PROACTIVELY when GitHub Actions / GitLab CI workflow files change. 공격자 관점 보안 검증(OWASP CICD Top 10, SLSA, pipeline poisoning)은 cicd-security-reviewer를 함께 호출."
    - name: cicd-security-reviewer
      lines: 454
      title: "CI/CD Security Reviewer (Attack Surface Focus)"
      desc: "CI/CD 공격 표면 전문 리뷰어 — OWASP Top 10 CI/CD Risks + SLSA framework. Pipeline poisoning, secret exfiltration, supply chain compromise를 공격자 관점에서 검증. Use when 보안 audit 또는 공격 시나리오 검증이 필요할 때. 비용/캐싱/best practice 같은 일반 검증은 cicd-reviewer 사용."
    - name: gitops-reviewer
      lines: 497
      title: "GitOps Configuration Reviewer"
      desc: "AI-powered GitOps configuration reviewer. Use PROACTIVELY after ArgoCD Application, Flux Kustomization, or Helm values changes to catch sync, drift, security, and environment isolation issues. Provides Category Budget scoring."
  dx:
    - name: code-reviewer
      lines: 452
      title: "Code Reviewer Agent"
      desc: "Cross-language 시니어 코드 리뷰어 — correctness, readability, 명명, 중복, 테스트 커버리지, 일반 best practice. Use PROACTIVELY after any code change as the default reviewer. 언어 특화 깊은 검증(Go concurrency, Java JVM/Virtual Threads, Python asyncio, React Server Components)은 go-/java-/python-/frontend-expert를 함께 호출."
    - name: dev-logger
      lines: 244
      title: "Dev Logger Agent"
      desc: "개발 과정 기록 에이전트. AI 수정 요청(feedback), 아키텍처 결정(decision), 시스템 개선(meta), 트러블슈팅(trouble) 기록을 구조화된 마크다운으로 저장. Use when /log-* commands are invoked."
    - name: git-workflow
      lines: 496
      title: "Git Workflow Agent"
      desc: "Git 워크플로우 자동화 에이전트. 커밋 메시지 생성, PR 자동화, Changelog 생성, 브랜치 전략 가이드. Use PROACTIVELY when committing, creating PRs, or preparing releases."
    - name: product-engineer
      lines: 302
      title: "Product Engineer Agent"
      desc: "요구사항 분석, 유저스토리 작성, 우선순위 결정, MVP 스코핑 에이전트. 비즈니스 목표와 기술 구현 사이의 번역자. Use for requirements engineering, prioritization, and product strategy."
    - name: security-scanner
      lines: 209
      title: "Security Scanner Agent"
      desc: "AI-powered security vulnerability scanner. Use PROACTIVELY after code changes to detect security issues, misconfigurations, and compliance violations before they reach production."
    - name: tech-lead
      lines: 621
      title: "Tech Lead Agent"
      desc: "기술 전략 수립, RFC/ADR 주도, 팀 오케스트레이션 에이전트. Claude Code Team의 리더 역할. Use for strategic technical decisions, RFC/ADR workflow, and team orchestration. 새 프로젝트의 tenancy/auth/payment/notification 4 ADR orchestration은 business-decision-agent로 위임. 본 agent는 전사 governance / Tech Radar / Build vs Buy 결정에 집중."
  frontend:
    - name: frontend-expert
      lines: 364
      title: "Frontend Expert Agent"
      desc: "Frontend 전문가 — React 19, Next.js 15/16 App Router, React Server Components, React Compiler, Core Web Vitals, 접근성, Vitest/Playwright. Use when frontend-specific Server/Client component 경계 / 성능 / 접근성 검증이 필요할 때. 일반 코드 품질(가독성, 테스트, 명명, 중복)은 code-reviewer 사용. 두 agent 함께 호출 시 frontend 특화 영역은 frontend-expert 결과 우선."
  infra:
    - name: container-security-reviewer
      lines: 440
      title: "Container Security Reviewer (Attack Surface Focus)"
      desc: "컨테이너 공격 표면 전문 리뷰어 — CIS Docker Benchmark + 공급망 공격 방지. Container escape, signed image, runtime security를 공격자 관점에서 검증. Use when 컨테이너 hardening / 공급망 audit이 필요할 때. 일반 빌드 품질(layer optim, size, base image)은 dockerfile-reviewer 사용."
    - name: dockerfile-reviewer
      lines: 464
      title: "Dockerfile & Container Image Reviewer"
      desc: "Dockerfile / docker-compose 종합 리뷰어 — base image 선택, 레이어 최적화, multi-stage, 빌드 캐시, 이미지 size, Compose 품질. Use PROACTIVELY when Dockerfile or docker-compose files change. 컨테이너 탈출 / 공급망 공격 / 런타임 보안 전문 검증은 container-security-reviewer를 함께 호출."
    - name: infra-roadmap-planner
      lines: 592
      title: "Infrastructure Roadmap Planner Agent"
      desc: "Multi-phase 인프라 전환 계획 에이전트. EC2/docker-compose → kind/k3s → EKS/GKE 같은 단계별 인프라 진화를 계획하고, 처음부터 변수화·호환성을 고려한 설계를 지원. Use for infrastructure roadmap planning, environment progression strategy, and Day 0 design decisions."
    - name: migration-expert
      lines: 657
      title: "Migration Expert Agent"
      desc: "프레임워크, 언어, DB, 인프라 버전 업그레이드 전문 에이전트. 위험 평가, 계획 수립, 단계별 실행, 검증까지 마이그레이션 전체 사이클 지원. Use for framework/db/k8s version upgrades and migration planning."
    - name: terraform-reviewer
      lines: 369
      title: "Terraform Reviewer Agent"
      desc: "AI-powered Terraform/OpenTofu code reviewer. Use PROACTIVELY before terraform apply to catch misconfigurations, security issues, cost implications, and best practice violations."
  k8s:
    - name: k8s-reviewer
      lines: 516
      title: "Kubernetes Manifest Reviewer"
      desc: "K8s manifest / Helm chart / Kustomize 종합 리뷰어 — Pod Security Standards, RBAC, 리소스 관리, 고가용성, 이미지 정책. Use PROACTIVELY when K8s manifest files change. Red team 관점 공격 시나리오(MITRE ATT&CK, container escape, lateral movement)는 k8s-security-reviewer를 함께 호출."
    - name: k8s-security-reviewer
      lines: 495
      title: "Kubernetes Security Reviewer (Attack Surface Focus)"
      desc: "K8s 공격 표면 전문 리뷰어 — CIS K8s Benchmark + MITRE ATT&CK for Containers. Container escape, lateral movement, privilege escalation을 공격자 관점에서 검증. Use when red team / 보안 audit / 공격 시나리오 검증이 필요할 때. 일반 best practice(PSS, RBAC, 리소스)는 k8s-reviewer 사용."
    - name: k8s-troubleshooter
      lines: 296
      title: "Kubernetes Troubleshooter Agent"
      desc: "AI-powered Kubernetes troubleshooting agent. Use when pods are failing, services are unreachable, or clusters have issues. Performs root cause analysis with AIOps methodology."
    - name: network-security-reviewer
      lines: 556
      title: "Network Security Reviewer (Attack Surface Focus)"
      desc: "K8s 네트워크 공격 표면 전문 리뷰어 — Zero Trust + MITRE ATT&CK Lateral Movement. NetworkPolicy / 서비스 메시 mTLS / egress filtering 검증. Use when NetworkPolicy 변경 / 서비스 메시 PeerAuth/AuthorizationPolicy 변경 / lateral movement·data exfiltration 시나리오 검증이 필요할 때."
  observability:
    - name: observability-reviewer
      lines: 564
      title: "Observability Configuration Reviewer"
      desc: "AI-powered observability configuration reviewer. Use PROACTIVELY after Prometheus rules, Alertmanager config, Grafana dashboard, or OTel collector changes to catch alert quality, cardinality, cost, and SLO consistency issues. Provides Category Budget scoring."
  platform:
    - name: platform-engineer
      lines: 205
      title: "Platform Engineer Agent"
      desc: "Platform Engineering *구현* 에이전트. Internal Developer Platform (IDP) 구축, Backstage 배포, Software Template 작성, Golden Path 구현에 특화. Use for building developer portals and improving developer productivity (helm chart / k8s manifest / Backstage code). IDP 도입 여부 / MLOps platform 선택 / GPU 스케줄링 같은 *전략 결정*은 platform-strategy-agent로 위임."
    - name: platform-strategy-agent
      lines: 350
      title: "Platform Strategy Agent"
      desc: "Internal Developer Platform(IDP) 전략 결정 에이전트 — Backstage 도입 여부, Golden Path 정의, MLOps/GPU 스케줄링/WASM Edge 등 platform layer 도입 ADR 작성. Use when 신규 조직의 platform layer 설계 / 기존 인프라에 IDP 도입 검토 / MLOps·GPU·Edge workload 통합 결정이 필요할 때. helm/k8s 구현은 platform-engineer 사용."
  saas:
    - name: business-decision-agent
      lines: 356
      title: "Business Decision Agent"
      desc: "신규 SaaS 부트스트랩의 4 ADR 일관성 orchestration 에이전트 — 멀티테넌시, 인증 Provider, 결제 Provider, 알림 채널 결정을 순서대로 수행해 일관된 ADR set을 produce. 한국 B2C 시장(Kakao 로그인 / PortOne·Toss 결제 / 카카오톡 알림톡 / PIPA) 가중치 내장. Use when 새 프로젝트 0→1 단계의 비즈니스 도메인 결정 / 신규 도메인의 격리·인증·결제·알림 ADR 작성이 필요할 때. 전사 RFC governance나 Tech Radar는 tech-lead 사용."
  security:
    - name: compliance-auditor
      lines: 528
      title: "Compliance Auditor Agent"
      desc: "SOC2/HIPAA/GDPR/PCI-DSS 컴플라이언스 *사후* 감사 에이전트 — 자동화된 보안 체크, 증거 수집, 감사 보고서 생성. Use for 정기 컴플라이언스 audit / 규제 요구사항 변경 영향 분석 / SOC2 Type II evidence 자동 수집 / GDPR DPIA 작성. 신규 프로젝트의 *설계 단계* compliance 결정(PIPA built-in / GDPR Art.25 Privacy by Design)은 compliance-strategy-agent로 위임."
    - name: compliance-strategy-agent
      lines: 332
      title: "Compliance Strategy Agent"
      desc: "설계 단계 컴플라이언스 결정 에이전트 — 한국 PIPA(개인정보 보호법) / 위치정보법 / GDPR / CCPA / PCI-DSS를 built-in design으로 통합. 새 프로젝트의 geo-target에 따라 사전 컴플라이언스 요구사항을 ADR + blueprint로 produce. Use when 신규 프로젝트의 geo-target이 확정된 직후 / 데이터 모델·인증·결제 ADR 작성 전 / EU·미국·한국 시장 진출 의사결정 직후. 사후 audit·evidence collection은 compliance-auditor 사용."
  service-mesh:
    - name: service-mesh-expert
      lines: 597
      title: "Service Mesh Expert Agent"
      desc: "Istio/Linkerd 서비스 메시 전문가 — mTLS 디버깅, 트래픽 관리(VirtualService/DestinationRule), AuthorizationPolicy, Ambient mode (ztunnel/waypoint) 트러블슈팅. Use when 서비스 메시 도입/튜닝 / mTLS 인증서 이슈 / cross-cluster routing / Ambient ↔ Sidecar 전환이 필요할 때."
  sre:
    - name: cost-analyzer
      lines: 433
      title: "Cost Analyzer Agent"
      desc: "AI-powered FinOps cost analyzer. Use to analyze cloud spending, identify optimization opportunities, detect anomalies, and provide actionable cost reduction recommendations."
    - name: debugging-expert
      lines: 487
      title: "Debugging Expert Agent"
      desc: "Cascade failure 분석 / cross-service 디버깅 전문가 — 의존성 그래프 매핑, blast radius 추적, 타임라인 상관분석으로 근본 원인 식별. Use when 분산 시스템 장애 / 다중 서비스 cascade 실패 / cross-service 타임아웃·에러가 발생할 때. 단일 서비스 디버깅은 일반 expert 또는 k8s-troubleshooter 사용."
    - name: finops-advisor
      lines: 265
      title: "FinOps Advisor Agent"
      desc: "FinOps 전략 조언자 에이전트. FinOps Foundation Framework 기반 성숙도 평가, 도구 선택, Unit Economics, GreenOps 통합에 특화. Use for cloud cost strategy, maturity assessment, and tool selection."
    - name: incident-responder
      lines: 382
      title: "Incident Responder Agent"
      desc: "AI-powered SRE incident responder. Use during production incidents for rapid triage, root cause analysis, and guided remediation. Follows human-on-the-loop methodology."
    - name: load-tester
      lines: 199
      title: "Load Tester Agent (Hub)"
      desc: "부하 테스트 허브 에이전트. K6, Gatling, nGrinder 도구 비교 및 선택 가이드. Use for choosing the right load testing tool and common performance testing concepts."
