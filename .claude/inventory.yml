    - name: observability-otel
      lines: 504
      title: "OpenTelemetry Patterns"
      desc: "OTel 기본 설정 — Spring Boot·Go 계측, Collector 구성, 샘플링 전략, Collector 버전 관리, Tempo v2 Scoped Tag API. Use when Java·Go 서비스에 OpenTelemetry 를 처음 붙이거나 Collector 파이프라인을 짤 때. 배포·스케일은 하위 otel skill."
    - name: observability-otel-collector-helm
      lines: 487
      title: "OTel Collector Helm Chart 패턴"
      desc: "OTel Collector Helm chart — 환경별 values, ArgoCD Application 통합, presets, ServiceMonitor, Kafka TLS·SASL 인증. Use when Kubernetes 에 OTel Collector 를 Helm 으로 배포하고 환경별 설정을 나눌 때."
    - name: observability-otel-migration
      lines: 464
      title: "OTel Migration Patterns"
      desc: "OTel 마이그레이션 — Grafana Agent→Alloy, Zipkin→OTLP, Semantic Conventions 전환, Declarative Configuration 1.0.0. Use when 구 계측·수집 구성을 OTel 표준으로 옮기거나 attribute 이름을 바꿀 때. Alloy 에서 나올 땐 alloy-to-otel."
    - name: observability-otel-optimization
      lines: 527
      title: "OpenTelemetry 비용 최적화 가이드"
      desc: "OTel 비용·안정성 최적화 — Kafka 버퍼 아키텍처, 데이터 볼륨 절감, Collector 모니터링·알림, Alloy 알려진 이슈, HikariCP 메트릭. Use when Collector 앞뒤에 Kafka 를 두거나 텔레메트리 볼륨을 줄일 때."
    - name: observability-otel-scale
      lines: 497
      title: "OpenTelemetry 대규모 트래픽 설정 가이드"
      desc: "OTel 대규모 트래픽 구성 — 규모별 아키텍처, Agent DaemonSet·Gateway Deployment+HPA, tail-based sampling 설정. Use when 초당 수만~수십만 요청 환경에서 Collector 를 스케일링하고 샘플링 전략을 정할 때."
    - name: observability-pyroscope
      lines: 485
      title: "Continuous Profiling with Pyroscope"
      desc: "Pyroscope continuous profiling — eBPF·SDK·Java Agent 연동, Alloy 통합, Span Profiles(trace-profile 연결), OTLP ingestion, FlameQL. Use when 상시 프로파일링과 flame graph 로 CPU·메모리 병목을 트레이스와 함께 찾을 때."
    - name: otel-pitfalls
      lines: 163
      title: "OTel 실전 Pitfalls"
      desc: "OpenTelemetry 실전 함정 — Spring Boot BOM 버전 충돌, Java Agent 메모리, OTLP protocol 변경, HikariCP 초기화 순서, Agent·Starter 이중 계측, PII 유출. Use when OTel Java 계측 후 트레이스가 안 나오거나 버전·메모리 문제를 만났을 때."
