      desc: "Platform Engineering *구현* 에이전트. Internal Developer Platform (IDP) 구축, Backstage 배포, Software Template 작성, Golden Path 구현에 특화. Use for building developer portals and improving developer productivity (helm chart / k8s manifest / Backstage code). IDP 도입 여부 / MLOps platform 선택 / GPU 스케줄링 같은 *전략 결정*은 platform-strategy-agent로 위임."
