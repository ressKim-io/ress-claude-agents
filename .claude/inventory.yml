      lines: 356
      title: "Business Decision Agent"
      desc: "신규 SaaS 부트스트랩의 4 ADR 일관성 orchestration 에이전트 — 멀티테넌시, 인증 Provider, 결제 Provider, 알림 채널 결정을 순서대로 수행해 일관된 ADR set을 produce. 한국 B2C 시장(Kakao 로그인 / PortOne·Toss 결제 / 카카오톡 알림톡 / PIPA) 가중치 내장. Use when 새 프로젝트 0→1 단계의 비즈니스 도메인 결정 / 신규 도메인의 격리·인증·결제·알림 ADR 작성이 필요할 때. 전사 RFC governance나 Tech Radar는 tech-lead 사용."
  security:
    - name: compliance-auditor
      lines: 528
      title: "Compliance Auditor Agent"
      desc: "SOC2/HIPAA/GDPR/PCI-DSS 컴플라이언스 *사후* 감사 에이전트 — 자동화된 보안 체크, 증거 수집, 감사 보고서 생성. Use for 정기 컴플라이언스 audit / 규제 요구사항 변경 영향 분석 / SOC2 Type II evidence 자동 수집 / GDPR DPIA 작성. 신규 프로젝트의 *설계 단계* compliance 결정(PIPA built-in / GDPR Art.25 Privacy by Design)은 compliance-strategy-agent로 위임."
    - name: compliance-strategy-agent
      lines: 332
      title: "Compliance Strategy Agent"
      desc: "설계 단계 컴플라이언스 결정 에이전트 — 한국 PIPA(개인정보 보호법) / 위치정보법 / GDPR / CCPA / PCI-DSS를 built-in design으로 통합. 새 프로젝트의 geo-target에 따라 사전 컴플라이언스 요구사항을 ADR + blueprint로 produce. Use when 신규 프로젝트의 geo-target이 확정된 직후 / 데이터 모델·인증·결제 ADR 작성 전 / EU·미국·한국 시장 진출 의사결정 직후. 사후 audit·evidence collection은 compliance-auditor 사용."
  service-mesh:
