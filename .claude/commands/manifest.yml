  - id: dx-issue-create
    category: dx
    title: GitHub Issue Creator
    description: 템플릿 기반으로 Issue를 생성합니다
    skills: [git-workflow]
    related: [dx-pr-create]

  - id: dx-changelog
    category: dx
    title: Changelog Generator
    description: 커밋 히스토리 기반으로 CHANGELOG를 생성합니다
    skills: [conventional-commits]
    related: [dx-release, dx-pr-create]

  - id: dx-release
    category: dx
    title: Release Manager
    description: 버전 태그 및 GitHub Release를 생성합니다
    skills: [conventional-commits, git-workflow]
    related: [dx-changelog]

  # ============================================
  # Memory & Dev-log Commands (flattened)
  # ============================================
  - id: memory-log-trouble
    category: memory
    title: Log Trouble
    description: 트러블슈팅 과정을 기록합니다 (원인 분석, 해결, 회귀 테스트)
    skills: []
    related: [memory-log-decision, memory-log-meta]

  - id: memory-log-decision
    category: memory
    title: Log Decision
    description: 기술/아키텍처 의사결정을 기록합니다 (A vs B, 트레이드오프)
    skills: []
    related: [memory-log-trouble, memory-promote-devlog]

  - id: memory-log-meta
    category: memory
    title: Log Meta
    description: Rule/Skill/Agent 추가·변경 사유를 기록합니다
    skills: []
    related: [memory-log-decision]

  - id: memory-log-feedback
    category: memory
    title: Log Feedback
    description: AI 출력 수정 요청을 기록합니다 (패턴 불일치, 누락)
    skills: []
    related: [memory-log-meta]

  - id: memory-log-summary
    category: memory
    title: Log Summary
    description: 현재 세션의 주요 활동을 자동 요약합니다
    skills: []
