  # ============================================
  # PR Review Commands (flattened)
  # ============================================
  # id 가 `review-review-pr` 로 stutter 하는 것은 의도된 것이다. 파일명이 이미
  # category 를 포함(`review/review-pr.md`)하는데, 이는 rule 이 참조하는 bare 이름
  # `/review-pr` 하위호환을 보존하기 위함이다. generate-docs.sh 는 id 에서 category
  # prefix 를 1회만 제거(`${cmd_id#${category}-}`)하므로 이 형태여야 이름이 맞는다.
  - id: review-review-pr
    category: review
    title: Review PR
    description: PR 코드 리뷰를 3개 관점의 에이전트로 병렬 실행해 종합합니다
    skills: []
    related: [review-review-pr-k8s, review-review-pr-terraform]

  - id: review-review-pr-k8s
    category: review
    title: Review PR (K8s)
    description: K8s/Helm/ArgoCD 영역 PR을 3개 전문 관점으로 병렬 리뷰합니다
    skills: []
    related: [review-review-pr]

  - id: review-review-pr-monitoring
    category: review
    title: Review PR (Monitoring)
    description: 모니터링 영역 PR을 3개 전문 관점으로 병렬 리뷰합니다
    skills: []
    related: [review-review-pr]

  - id: review-review-pr-terraform
    category: review
    title: Review PR (Terraform)
    description: Terraform PR을 3개 전문 관점으로 병렬 리뷰합니다
    skills: []
    related: [review-review-pr]

  # ============================================
  # Workflow Commands (flattened)
  # ============================================
  - id: workflow-phase-start
    category: workflow
    title: Phase Start
    description: SDD Phase 게이트 작업 시작 (11항목 체크리스트 + Gate 1-5)
    skills: [spec-driven-development]
    related: [memory-log-decision]

# Category metadata
categories:
  session:
    title: Session
    description: 세션 컨텍스트 관리
    icon: "📋"

  go:
    title: Go
    description: Go 백엔드 개발
    icon: "🔵"

  java:
    title: Java
    description: Java 21+ / Spring Boot 3.x 개발
    icon: "☕"

  backend:
    title: Backend
    description: Java/Kotlin 백엔드 개발
    icon: "☕"

  k8s:
    title: Kubernetes
    description: Kubernetes 운영
    icon: "☸️"

  terraform:
    title: Terraform
    description: 인프라 관리
    icon: "🏗️"

  dx:
    title: DX
    description: Developer Experience
    icon: "🛠️"

  # flatten: true — install.sh 가 commands 루트에도 심볼릭 링크를 만들어
  # bare 이름(/where, /log-trouble)으로 호출된다. 설치되는 rule
  # (devlog-lifecycle / phase-workflow / code-review)이 bare 이름으로
  # 참조하므로 네임스페이스 형태만으로는 링크가 깨진다.
  memory:
    title: Memory & Dev-logs
    description: dev-log 작성·정리·승격, 지식 횡단 검색
    icon: "🧠"
    flatten: true

  review:
    title: PR Review
    description: 다관점 PR 코드 리뷰
    icon: "🔍"
    flatten: true

  workflow:
    title: Workflow
    description: SDD Phase 게이트 워크플로우
    icon: "🚦"
    flatten: true
